name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download dataset
        run: python -m src.data.download

      - name: Compile Python modules
        run: |
          python -m py_compile src/training/train.py
          python -m py_compile src/evaluation/model_benchmark.py
          python -m py_compile src/explainability/explain.py
          python -m py_compile src/monitoring/drift.py
          python -m py_compile src/api/main.py

      - name: Run tests
        run: pytest -q

      - name: Build Docker image
        run: docker build -t predictive-maintenance-api .
